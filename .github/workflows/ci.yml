name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge queue support: without this trigger, queue-created merge groups never
  # get the required `ci` check and every queued merge fails. Inert until the
  # queue is enabled in repo settings.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (Program-Fix 47): every job only checks out
# the repo and runs npm scripts; nothing here calls the GitHub API.
permissions:
  contents: read

# Every check runs as its own job, side by side, and the test suite is split
# into 4 shards. Wall time is the slowest job (a test shard), not the sum of
# every step. The final `ci` job is the REQUIRED status check in branch
# protection: it keeps the name `ci` and passes only when every job above it
# succeeded, so branch protection needs no change.
jobs:
  # Fails when src/db/schema.ts has changes not covered by drizzle/
  # (drizzle-kit generate diffs schema.ts against the latest drizzle/meta
  # snapshot — no DB connection needed — and writes files only on drift).
  # BLOCKING since the 0005 snapshot catch-up: an unapplied schema change
  # can no longer merge (the 2026-06-11 outage class is unmergeable).
  drift:
    name: migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Migration drift check (schema vs drizzle/)
        run: |
          npx drizzle-kit generate --name ci_drift_check
          drift="$(git status --porcelain -- drizzle/)"
          # Restore drizzle/ so no generated drift artifact is left on disk.
          # This job has no later steps (the test shards run in their own
          # checkouts), but the restore is kept so the check leaves the tree
          # exactly as it found it.
          git checkout -- drizzle/
          git clean -fdq drizzle/
          if [ -n "$drift" ]; then
            echo "::error::src/db/schema.ts has changes not covered by checked-in drizzle/ migrations. Run 'npx drizzle-kit generate', review the SQL, and commit it (drizzle selects explicit column lists — an unapplied schema change breaks every query on the altered table; see the 2026-06-11 outage)."
            echo "$drift"
            exit 1
          fi
          echo "schema.ts and drizzle/ migrations agree"

  # Migration safety (scripts/ci/migration-guard.mjs, tests/ci-migration-guard.test.ts).
  # Prod migrations are applied by hand, so this job makes the PR wait for
  # them instead of the deploy: (1) every drizzle/*.sql the PR adds must be
  # additive (no DROP, RENAME, type change, SET NOT NULL, NOT NULL column
  # without DEFAULT, TRUNCATE, DELETE, UPDATE) unless the file carries a
  # reviewed "-- migration-guard: allow-destructive [after-deploy] <reason>"
  # line; (2) a PR that adds a journal entry stays RED until production has
  # applied it (GET /api/version/migrations, Bearer MIGRATIONS_READ_TOKEN, a read-only
  # token: release safety part C keeps CRON_SECRET out of pull request runs). Apply it
  # with /migrate-prod from the PR branch, then re-run this job. A PR without
  # migration changes never calls production. Fork and Dependabot PRs get no
  # secrets, so one of them that adds a migration fails closed here.
  migrations:
    name: migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the guard diffs the PR against its merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: New migrations are additive and already applied in production
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MIGRATIONS_READ_TOKEN: ${{ secrets.MIGRATIONS_READ_TOKEN }}
          MIGRATIONS_URL: https://smartremit.ai/api/version/migrations
        run: node scripts/ci/migration-guard.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Program-Fix 40: fail on a tracked iCloud duplicate ("page 3.tsx", "dir 2/").
      - name: No tracked iCloud duplicates
        run: node scripts/check-icloud-dups.mjs

  # The Vitest suite in 4 shards. `--shard=i/4` sorts the test files by a hash
  # of their path and runs slice i, so the 4 shards together run every file
  # exactly once (vitest 3.2.6, BaseSequencer.shard in
  # node_modules/vitest/dist/chunks/coverage.DfSpMS-b.js). The shards do NOT
  # pass --passWithNoTests (which `npm test` does): a shard that resolves no
  # test files then exits non-zero instead of passing silently.
  # GitHub Actions sets CI=true, so vitest.config.ts keeps retry: 1 and
  # Vitest's default worker count, as before.
  test:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One red shard must not cancel the others: every failure is reported.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: npx vitest run --shard="${SHARD}/4"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The @next/mdx wrap in next.config.ts touches the build for every route: fail if any
      # existing route changed rendering mode or disappeared (new routes are listed, not failed).
      - name: Route rendering modes unchanged
        run: node scripts/check-route-modes.mjs

  # Blocking at high. Its own job, so a dependency advisory never hides the
  # typecheck/lint/test/build results on the PR (2026-09-09 to 09-14 every
  # PR was red here and no other check ran).
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Pull requests only (the script skips other events): fails when the PR
      # ADDS a runtime package version with a high/critical advisory, from
      # GitHub's dependency graph diff; dev-scope findings and API errors only
      # warn (scripts/ci/dependency-review.mjs).
      - name: Dependency review (packages this PR adds)
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/dependency-review.mjs

  # Compliance A3: secret scan + SAST + lockfile scan, the free/OSS stand-in
  # for GitHub Advanced Security, kept so the checks survive the repo going
  # private (it is public as of 2026-10-04, so GitHub's own CodeQL default
  # setup also runs, outside this file). No npm ci: the scanners are
  # standalone. Every tool is pinned by version AND sha256 (or image digest);
  # nothing uploads source anywhere, and no SARIF goes to code scanning.
  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      # gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      OSV_SCANNER_VERSION: '2.6.0'
      # osv-scanner_linux_amd64, from the release's osv-scanner_SHA256SUMS.
      OSV_SCANNER_SHA256: 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108'
      # Semgrep CE, multi-arch index digest of the 1.178.0 tag.
      SEMGREP_IMAGE: 'semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b'
      # semgrep/semgrep-rules at a fixed commit (the git object id is the
      # integrity check). Fetched at run time, never vendored: the Semgrep
      # Rules License v1.0 allows internal use, not redistribution.
      SEMGREP_RULES_COMMIT: 'a84ff9cc2453ca91d581380de4b8b3f272f6f4be'
    steps:
      # Full history: the diff range below must resolve both ends (the script
      # fails closed on a shallow clone). Cheap here (a few hundred commits).
      # No token left in .git/config: nothing below needs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks + osv-scanner (sha256-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          curl -sSfL -o bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  bin/osv-scanner" | sha256sum -c -
          chmod +x bin/gitleaks bin/osv-scanner

      # Only the commits this run adds (the nightly scans full history):
      # PR base..head, merge-group base..head, or push before..sha (a new ref
      # or an unknown `before` falls back to the pushed commit alone). The
      # range logic lives in the script so the nightly and a local proof run
      # the same command. A push run cancelled by the next push (concurrency
      # above) leaves its range to the nightly full scan. Baseline:
      # .gitleaksignore (commit-bound fingerprints, reviewed) and .gitleaks.toml
      # (default rules + value-exact allowlists). Fails closed (exit 2) on a
      # shallow clone, a range end missing from the clone or an empty range.
      - name: Secret scan (gitleaks, new commits)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/bin/gitleaks
          SCAN_MODE: diff
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci/gitleaks-scan.sh

      # Whole tree (tracked files; ~20 s), TS + JS rule packs only, blocking
      # on ERROR severity. `scan` with --metrics=off and local --config paths
      # makes no call to semgrep.dev (never `semgrep ci`, never --config auto).
      # The rules clone sits in RUNNER_TEMP so its own JS/TS fixtures are not
      # scanned; --user keeps git's ownership check happy so the scan stays
      # limited to tracked files; --network none: the container has no network
      # at all (rules are local). Baseline: `// nosemgrep: <rule-id>` with a
      # reason on the line before each reviewed finding.
      - name: SAST (Semgrep CE)
        run: |
          rules="$RUNNER_TEMP/semgrep-rules"
          git init -q "$rules"
          git -C "$rules" fetch -q --depth 1 https://github.com/semgrep/semgrep-rules "$SEMGREP_RULES_COMMIT"
          git -C "$rules" checkout -q FETCH_HEAD
          test "$(git -C "$rules" rev-parse HEAD)" = "$SEMGREP_RULES_COMMIT"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -v "$rules:/rules:ro" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check \
              --config /rules/javascript --config /rules/typescript \
              --severity ERROR --error

      # report-only, deliberately. `npm audit --omit=dev --audit-level=high`
      # (the audit job) stays the blocking dependency gate. osv-scanner adds
      # dev dependencies and moderate advisories, which mostly only the
      # Dependabot PRs can fix; gating on them (or on an osv.dev outage) would
      # stall every PR. Findings and tool errors surface as a ::warning:: and a
      # table in the job summary. Sends package names + versions to osv.dev,
      # never source.
      - name: Lockfile scan (osv-scanner, report-only)
        run: |
          rc=0
          "$RUNNER_TEMP/bin/osv-scanner" scan source -L package-lock.json --format markdown --output-file "$RUNNER_TEMP/osv.md" || rc=$?
          if [ -f "$RUNNER_TEMP/osv.md" ]; then tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/osv.md"; fi
          case "$rc" in
            0) echo "osv-scanner: no known vulnerabilities in package-lock.json" ;;
            1) echo "::warning title=osv-scanner::advisories found in package-lock.json (report-only; see the job summary)" ;;
            *) echo "::warning title=osv-scanner::scanner did not complete (exit $rc); report-only, not blocking" ;;
          esac

  # The REQUIRED status check. Keep the job name exactly `ci`, and let no other
  # job use that name. `if: always()` makes it run (and report) even when a
  # job above failed or was cancelled; it then passes only when every needed
  # job succeeded. A matrix job's result is `failure` when any shard failed.
  ci:
    name: ci
    if: always()
    needs: [drift, migrations, typecheck, lint, test, build, audit, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$failed" ]; then
            echo "::error title=CI::These checks did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All checks succeeded."
