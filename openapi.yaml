# SmartRemit Partner API — the hand-maintained source of truth for /api/partner/v1.
#
# tests/openapi-drift.test.ts compares this file with the route handlers under
# src/app/api/partner/v1 in BOTH directions (every route and method, its scope,
# and the full set of HTTP statuses it can return). Change a route and this file
# in the same PR.
#
# Vendor extensions (every operation must carry both):
#   x-smartremit-scope    the scope the route's guardPartner(req, '<scope>') requires
#   x-smartremit-sandbox  true when a test (sr_test_…) key holds that scope
#
# Examples are fictional: phones use the reserved +1 202 555 01XX range and keys
# are written sr_test_… / sr_live_….
openapi: 3.1.0
info:
  title: SmartRemit Partner API
  version: '1'
  description: >
    Non-custodial remittance orchestration. SmartRemit never holds funds; partners are
    the licensed money transmitters. Authenticate every request with a Bearer API key:
    sr_test_… keys work in the sandbox only (they create and see sandbox transactions,
    which settle on the mock rail), sr_live_… keys after go-live. Errors are JSON
    `{ "error": "…" }`: match on the HTTP status, not the text. A body that is not
    valid JSON is treated as an empty object, so it is refused by field validation
    rather than as malformed input. Rate limit: 120 requests per minute per partner
    (all keys together) and 120 per minute per key, in fixed UTC calendar minutes.
servers:
  - url: https://smartremit.ai/api/partner/v1
security:
  - bearerAuth: []
tags:
  - name: Corridors
    description: Where this partner can send.
  - name: Quotes
    description: FX and fee pricing (nothing is stored).
  - name: Beneficiaries
    description: Payout-field validation and stored recipients.
  - name: Transactions
    description: Mint, read, list and confirm transfers.
  - name: Rates
    description: The partner's own wholesale conversion rates.
  - name: Settlements
    description: The settlements statement for reconciliation.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer sr_test_… or sr_live_…'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. Match on the HTTP status, not the text.
    Transaction:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          description: For example awaiting_payment, paid, in_review, delivered, blocked or cancelled.
        compliance_status: { type: string, description: 'cleared, flagged or blocked.' }
        amount_source: { type: number, description: Major units in source_currency. }
        source_currency: { type: string, description: ISO 4217. }
        amount_destination: { type: number, description: Payout amount in destination_currency. }
        destination_currency: { type: string, description: ISO 4217. }
        destination_country: { type: string, description: ISO 3166-1 alpha-2. }
        fee_source: { type: number }
        total_charge_source: { type: number }
        fx_rate: { type: number, description: Destination units per 1 source unit. }
        sender_phone: { type: string }
        sender_name: { type: [string, 'null'] }
        recipient_name: { type: string }
        funding_method: { type: string }
        funding_ref: { type: [string, 'null'] }
        refund_ref: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        partner_id: { type: string }
  responses:
    Unauthorized:
      description: Missing, malformed, unknown or revoked API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The key lacks this scope, or the partner is not active.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Over 120 requests per minute for the partner or the key. Retry-After is always 60.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /corridors:
    get:
      operationId: listCorridors
      summary: List your corridors
      description: >
        Data-driven corridor discovery for the partner resolved from the key: the brand,
        the send-to-India corridors for each allowed send currency, and the full supported
        destination set.
      tags: [Corridors]
      x-smartremit-scope: corridors:read
      x-smartremit-sandbox: true
      responses:
        '200':
          description: Corridors available to this partner.
          content:
            application/json:
              example:
                brand: Example Remit
                corridors:
                  - { source_country: US, source_currency: USD, destination_country: IN, destination_currency: INR }
                destinations: [IN, MX]
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks corridors:read, or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /quote:
    post:
      operationId: createQuote
      summary: Price a transfer
      description: >
        FX and fee quote at platform mid-market. Nothing is stored. Pass
        destination_country (resolved to its home currency) or destination_currency
        (default INR); destination_country wins when both are present.
      tags: [Quotes]
      x-smartremit-scope: quote
      x-smartremit-sandbox: true
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount_source: 200
              source_currency: USD
              destination_country: IN
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              example:
                amount_source: 200
                source_currency: USD
                fee_source: 1.99
                total_charge_source: 201.99
                amount_destination: 17040
                destination_currency: INR
                fx_rate: 85.2
        '400': { description: 'Invalid request: amount_source is not a positive number, destination_country or destination_currency is not supported, or the amount is outside the allowed range.' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks quote, or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }
        '503': { description: Live FX is temporarily unavailable. Nothing was stored; retry later. }

  /beneficiaries/validate:
    post:
      operationId: validateBeneficiary
      summary: Validate payout fields
      description: >
        Stateless payout-field validation for a destination country (a pre-check before
        creating a beneficiary or a transaction). Nothing is stored.
      tags: [Beneficiaries]
      x-smartremit-scope: beneficiaries:validate
      x-smartremit-sandbox: true
      requestBody:
        required: true
        content:
          application/json:
            example:
              country: IN
              fields: { accountNumber: '000123456789', ifsc: HDFC0001234 }
      responses:
        '200': { description: 'The fields are valid: { valid: true, payout_destination }.' }
        '400': { description: country is required. }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks beneficiaries:validate, or the partner is not active. }
        '422': { description: One or more fields are invalid. The error string is a JSON-encoded map of field name to message. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /beneficiaries:
    post:
      operationId: createBeneficiary
      summary: Store a beneficiary
      description: >
        Validate and store a partner-scoped beneficiary. Payout details are encrypted at
        rest. Not idempotent: a retry stores a second beneficiary.
      tags: [Beneficiaries]
      x-smartremit-scope: beneficiaries:write
      x-smartremit-sandbox: false
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Ravi Example
              country: IN
              payout_method: bank
              fields: { accountNumber: '000123456789', ifsc: HDFC0001234 }
      responses:
        '201': { description: 'Created: { id, name, country, payout_destination }.' }
        '400': { description: 'name is missing or not a clean name (1–80 characters, no brackets or control characters), payout_method is not bank, upi or usdc, or country is missing.' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks beneficiaries:write (test keys never hold it), or the partner is not active. }
        '422': { description: One or more payout fields are invalid. The error string is a JSON-encoded map of field name to message. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /transactions:
    post:
      operationId: createTransaction
      summary: Mint a transfer
      description: >
        Mint a transfer. The Idempotency-Key header is required: once a transaction exists
        under a key, every request with that key and a valid body returns that same
        transaction with its current state (the body is validated but not compared).
        Sanctions screening runs on every mint in every mode; a hit is 422 and the attempt
        is recorded as blocked. A transaction created without sender.name is held for
        manual review.
      tags: [Transactions]
      x-smartremit-scope: transactions:write
      x-smartremit-sandbox: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            A fresh random UUID per transaction, with no personal data. Values beginning
            draft:, b2binvoice:, sched: or test: are reserved.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount_source: 200
              source_currency: USD
              sender: { phone: '+12025550142', name: Jane Doe, kyc_status: verified }
              beneficiary:
                name: Ravi Example
                payout_method: bank
                payout_destination: 000123456789|HDFC0001234
      responses:
        '200':
          description: Replay of an existing Idempotency-Key (same transaction, current state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: 'Validation failed before the Idempotency-Key was bound: a missing or reserved Idempotency-Key; a missing or invalid amount, sender.phone, beneficiary name or payout destination; a name that is not clean; an unsupported payout_method or destination_country; or an amount outside the allowed range. A corrected retry with the same key succeeds.' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks transactions:write, or the partner is not active. }
        '404': { description: The beneficiary_id was not found for this partner. }
        '409': { description: Idempotency-Key conflict. Retry with a new key. }
        '422': { description: 'Refused: the payout destination is a masked display value, the stored beneficiary has no usable name, sender identity verification is required, the transfer exceeds the sender''s sending limit, or it was blocked by compliance screening.' }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }
        '503': { description: 'Live FX is temporarily unavailable, or another transfer for this sender is in progress. Nothing was minted; a retry may reuse the same Idempotency-Key.' }
    get:
      operationId: listTransactions
      summary: List your transfers
      description: Newest-first keyset list, scoped to the partner and the environment of the key.
      tags: [Transactions]
      x-smartremit-scope: transactions:read
      x-smartremit-sandbox: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1–100 (default 25).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page. Treat it as opaque.
          schema: { type: string }
      responses:
        '200': { description: A page of transactions with the next cursor (null on the last page). }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks transactions:read, or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /transactions/{id}:
    get:
      operationId: getTransaction
      summary: Fetch one transfer
      description: Partner-scoped read. A transaction outside your partner or your key's environment is 404.
      tags: [Transactions]
      x-smartremit-scope: transactions:read
      x-smartremit-sandbox: true
      parameters:
        - name: id
          in: path
          required: true
          description: The transaction id.
          schema: { type: string }
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks transactions:read, or the partner is not active. }
        '404': { description: Transaction not found. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /transactions/{id}/confirm:
    post:
      operationId: confirmTransaction
      summary: Confirm funds captured
      description: >
        Confirm that funds were captured, which begins settlement. A flagged transfer is held
        in_review until compliance staff release it. Confirming a transfer that is already
        paid, delivered or in_review returns it unchanged.
      tags: [Transactions]
      x-smartremit-scope: transactions:write
      x-smartremit-sandbox: true
      parameters:
        - name: id
          in: path
          required: true
          description: The transaction id. A transaction outside your partner or your key's environment is 404.
          schema: { type: string }
      responses:
        '200':
          description: The transaction after confirmation (paid, in_review, or already settled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks transactions:write, or the partner is not active. }
        '404': { description: Transaction not found. }
        '409': { description: The transaction is not awaiting payment (for example, it was cancelled). }
        '422': { description: The transfer was blocked by compliance screening. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /rates:
    put:
      operationId: pushRate
      summary: Push one corridor rate
      description: >
        Push the wholesale conversion rate you offer for one corridor. It competes for routed
        flow; it does not change your own /quote, which stays at platform mid-market.
        ttl_seconds defaults to 3600 and is clamped to 60–86400.
      tags: [Rates]
      x-smartremit-scope: rates:write
      x-smartremit-sandbox: false
      requestBody:
        required: true
        content:
          application/json:
            example:
              source_currency: USD
              destination_currency: INR
              effective_rate: 85.1
              ttl_seconds: 3600
      responses:
        '200': { description: The saved rate. }
        '400': { description: 'source_currency or destination_currency is unsupported or the two are equal, effective_rate is not a number greater than 0 and less than 100000, or ttl_seconds is not a number.' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks rates:write (test keys never hold it), or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }
    get:
      operationId: listRates
      summary: Your rate sheet
      description: The partner's current rates, with freshness and margin.
      tags: [Rates]
      x-smartremit-scope: rates:read
      x-smartremit-sandbox: false
      responses:
        '200': { description: The rate sheet. }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks rates:read (test keys never hold it), or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }

  /settlements:
    get:
      operationId: listSettlements
      summary: Settlements statement
      description: >
        The instruction ledger for reconciliation: every live transfer of yours that was paid
        and sent for settlement in a half-open [from, to) window on paid_at, in UTC. Oldest
        first. Totals cover the returned page only. Any partner_id parameter is ignored.
      tags: [Settlements]
      x-smartremit-scope: settlements:read
      x-smartremit-sandbox: false
      parameters:
        - name: from
          in: query
          required: false
          description: 'Window start: a date (midnight UTC) or a datetime (no zone means UTC). Default: yesterday.'
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Window end (exclusive). The window is at most 31 days.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size, 1–500 (default 100).
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page. Treat it as opaque.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: json (default) or csv. CSV is an attachment with the next cursor in the X-Next-Cursor header.
          schema: { type: string, enum: [json, csv] }
      responses:
        '200':
          description: 'The statement page: { settlements, next_cursor, totals, window }, or a CSV attachment.'
          content:
            application/json: {}
            text/csv: {}
        '400': { description: 'Invalid query: from or to is not a date or datetime, to is not after from, the window is longer than 31 days, or limit, cursor or format is invalid.' }
        '401': { $ref: '#/components/responses/Unauthorized', description: Missing or invalid key. }
        '403': { $ref: '#/components/responses/Forbidden', description: The key lacks settlements:read (test keys never hold it), or the partner is not active. }
        '429': { $ref: '#/components/responses/RateLimited', description: Rate limited. Retry after 60 seconds. }
