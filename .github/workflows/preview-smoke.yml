# Pre-merge smoke against the Vercel PREVIEW deployment of a PR — catches the
# class of failure that has reached prod twice (incl. the 2026-06-11 outage)
# because the only smoke ran post-deploy.
#
# Why deployment_status and not a job in ci.yml: ci.yml fires on pull_request
# BEFORE the Vercel preview exists (testing it there would need racy polling);
# deployment_status fires exactly when Vercel reports the deployment ready and
# carries its URL in github.event.deployment_status.environment_url (target_url
# holds the same URL and is the fallback). Same proven mechanism as smoke.yml
# (Production). The workflow file always comes from main, so a change here
# takes effect only after it merges.
#
# Preview deployments sit behind Vercel Deployment Protection, so Playwright
# sends the "Protection Bypass for Automation" header (see playwright.config.ts)
# using the VERCEL_AUTOMATION_BYPASS_SECRET repo secret:
# https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/protection-bypass-automation
# Until that secret exists, the smoke job SKIPS with a warning and the setup
# steps in the run summary. Secrets are not readable in job-level `if:`
# (actions/runner#520), so a tiny gate job exports presence as an output.
#
# Shared data: Preview deployments get the production DATABASE_URL (one Neon
# branch), so the smoke's self-provisioned fixtures (E2E Smoke Partner,
# e2e-smoke-partner, e2e-smoke-support) are the same rows the production smoke
# uses. The smoke job's concurrency group keeps two previews from racing on
# them. KV_REST_API_* (staff records and sessions live in Redis) and
# PASSWORD_PEPPER, like FIELD_ENCRYPTION_KEY, are scoped to Production only,
# so staff login cannot work on a preview until the owner decides how Preview
# gets them.
#
# NOT a required check.
name: Preview Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  gate:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run-smoke: ${{ steps.check.outputs.run-smoke }}
      url: ${{ steps.check.outputs.url }}
    steps:
      - name: Check the bypass secret and resolve the preview URL
        id: check
        shell: bash
        # Event fields and the secret reach the script through env only. The
        # secret is only tested for presence, never printed.
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -u
          if [ -z "$BYPASS_SECRET" ]; then
            echo "run-smoke=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview smoke skipped::The repo secret VERCEL_AUTOMATION_BYPASS_SECRET is not set, so Playwright cannot get past Vercel Deployment Protection on the preview. The run summary lists the setup steps."
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Preview smoke skipped: VERCEL_AUTOMATION_BYPASS_SECRET is not set

          Preview deployments are behind Vercel Deployment Protection. To let this smoke through:

          1. Vercel → claude-payments → Settings → Deployment Protection → Protection Bypass for Automation → create a secret.
          2. Copy it.
          3. Run `gh secret set VERCEL_AUTOMATION_BYPASS_SECRET` and paste the secret when prompted. Do not pass it through `echo` or a pipe.

          Staff login also needs `KV_REST_API_URL`, `KV_REST_API_TOKEN` and `PASSWORD_PEPPER` on Preview. Today they (and `FIELD_ENCRYPTION_KEY`) are scoped to Production only, so the login tests fail on a preview until the owner decides how Preview gets them.
          SUMMARY
            exit 0
          fi

          # Send the bypass secret and the E2E credentials only to this
          # project's Vercel preview host.
          url="${ENVIRONMENT_URL:-$TARGET_URL}"
          url="${url%/}"
          if [[ ! "$url" =~ ^https://claude-payments-[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error title=Preview smoke::The deployment_status event has no Vercel preview URL for this project (expected https://claude-payments-<id>.vercel.app in environment_url or target_url). Nothing was tested."
            exit 1
          fi
          echo "run-smoke=true" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Preview smoke will test ${url}."

  preview-smoke:
    needs: gate
    if: needs.gate.outputs.run-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One preview smoke at a time: the fixtures live in the shared database and
    # the partner spec deletes and recreates e2e-smoke-partner, so two runs at
    # once can break each other. A newer run waits; GitHub keeps one waiting
    # run per group and cancels an older waiting one.
    concurrency:
      group: preview-smoke-fixtures
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Run the spec version that matches the deployed code (the workflow
          # file itself still comes from the default branch). The sha comes
          # from Vercel's deployment object (write-scoped integration).
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Inline copy of .github/actions/setup-playwright (keep in sync): this
      # job checks out github.event.deployment.sha, and PR heads branched
      # before that action existed cannot resolve `uses: ./.github/actions/...`.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke test the preview deployment
        env:
          CI: 'true'
          # The per-deployment preview URL, validated by the gate job.
          # playwright.config.ts sends x-vercel-protection-bypass and
          # x-vercel-set-bypass-cookie on every page and API request when
          # VERCEL_AUTOMATION_BYPASS_SECRET is set.
          BASE_URL: ${{ needs.gate.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        run: npm run e2e

      # Trace zips are excluded, as in smoke.yml and nightly.yml (#247): a
      # trace records every fill() value (the staff passwords) and every
      # request header (the bypass secret).
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-trace
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 7
