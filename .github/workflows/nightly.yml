# Nightly health run: catches drift that per-PR CI cannot — newly published
# advisories, prod regressions between merges, and flake accumulation (the
# full vitest run still gets the CI-only retry from vitest.config.ts, but a
# persistent nightly failure means a real problem, not a parallel flake).
# 04:43 UTC — odd minute on purpose; GitHub delays/drops on-the-hour crons.
name: Nightly

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Full test suite
        run: npx vitest run

      # Program-Fix 49B (prompt-11): the real-model bot eval. The script itself
      # no-ops (exit 0) when the secret is absent, so this step is a no-op until
      # the owner adds EVAL_OLLAMA_API_KEY. A model failure is reported here but
      # never fails the nightly (continue-on-error) and never gates a merge.
      - name: Bot eval (real model, optional)
        continue-on-error: true
        # Bounded inside the job's 20 min: 24 calls x 22 s = 8.8 min worst case.
        timeout-minutes: 9
        env:
          EVAL_OLLAMA_API_KEY: ${{ secrets.EVAL_OLLAMA_API_KEY }}
        run: npx tsx scripts/eval-bot.ts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Blocking, same gate as ci.yml's audit job: catches a high advisory
      # published overnight against a production dependency already on main.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree (dev deps included), REPORT-ONLY since 2026-10-05: `braces`
      # (via eslint-config-next) has a high advisory with no fixed release,
      # so a blocking full-tree audit kept the Nightly red from Sep 30 on and
      # hid every other result. Dev tooling never ships to production;
      # findings land as a warning plus the job summary, and Dependabot PRs
      # fix what has a release.
      - name: Audit all dependencies (report-only)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          npm audit --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1 || rc=$?
          { echo '### Full-tree npm audit (report-only)'; echo '```'; tail -n 80 "$RUNNER_TEMP/audit.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Dev dependency advisories::npm audit (all dependencies) reports high advisories; report-only, see the job summary."
          else
            echo "npm audit (all dependencies): no high advisories"
          fi

  # Compliance A3: gitleaks over the FULL history of the default branch (the
  # per-PR job in ci.yml scans only new commits). Same pinned build and the
  # same script as ci.yml; baseline in .gitleaksignore. A found secret fails
  # this run. Redacted output only (public logs).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      # gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (sha256-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/bin/gitleaks
          SCAN_MODE: full
        run: bash scripts/ci/gitleaks-scan.sh

  prod-smoke:
    runs-on: ubuntu-latest
    # Release safety part C: production secrets live in the `prod-secrets`
    # GitHub environment (deployments from main only). A job with an
    # environment also posts a GitHub deployment record named after it; the
    # deployment_status triggers here and in preview-smoke.yml ignore that name.
    environment: prod-secrets
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Setup Playwright (cached)
        uses: ./.github/actions/setup-playwright

      - name: Live prod smoke
        env:
          CI: 'true'
          BASE_URL: https://smartremit.ai
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        # Every spec, the same set the post-deploy smoke runs (npm run e2e),
        # so an overnight break of the pay page, portal or public pages shows
        # up here too, not only the dashboard.
        run: npm run e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-playwright-trace
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 7

      - name: Production has applied every migration the served build expects
        # BLOCKING, like the post-deploy smoke's step: fails the nightly when
        # production is behind the served build's journal (a red smoke that
        # was missed, or a later rollback), or when the check cannot run.
        # Divergence (applied rows the journal does not list) only warns.
        # One read of GET /api/version/migrations (Bearer CRON_SECRET); no SHA
        # match, whatever production serves is checked.
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MIGRATIONS_URL: https://smartremit.ai/api/version/migrations
        run: |
          set -u
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error title=Migration check could not run::The CRON_SECRET repository secret is not available to this run, so production's migrations were NOT checked."
            exit 1
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          code="$(curl -sS --max-time 15 --retry 2 --retry-delay 5 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o "$body_file" -w '%{http_code}' \
              "${MIGRATIONS_URL}?cb=$(date +%s)-${RANDOM}")" || code="error"
          if [[ "$code" != "200" ]]; then
            echo "::error title=Migration check inconclusive::${MIGRATIONS_URL} answered HTTP ${code}; migration status was NOT checked."
            exit 1
          fi
          sha="$(jq -r '.sha // "unknown"' "$body_file")"
          unknown="$(jq -r '.unknownApplied | length' "$body_file")"
          if [[ "$unknown" != "0" ]]; then
            echo "::warning title=Prod migrations diverged::Production has ${unknown} applied migration row(s) that build ${sha}'s journal does not list (created_at: $(jq -r '.unknownApplied | map(tostring) | join(", ")' "$body_file"))."
          fi
          if [[ "$(jq -r '.ok' "$body_file")" == "true" ]]; then
            echo "Production has applied all $(jq -r '.expected' "$body_file") migrations build ${sha} expects."
          else
            echo "::error title=Prod migrations behind::Production has $(jq -r '.pending | length' "$body_file") migration(s) pending that build ${sha} expects: $(jq -r '.pending | join(", ")' "$body_file"). Apply via /migrate-prod."
            exit 1
          fi

  # Alert (scripts/ci/scheduled-alert.mjs): a failed job above opens one issue,
  # "Scheduled workflow failing: Nightly", or comments on the open one; the
  # next fully green run closes it. GitHub emails the repo owner about new
  # issues; before this, only whoever last edited the schedule heard about a
  # red run. The only job with write access, and only to issues.
  alert:
    needs: [full-tests, audit, secret-scan, prod-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Open, update or close the failure issue
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/scheduled-alert.mjs
