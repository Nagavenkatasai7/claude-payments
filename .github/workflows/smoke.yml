name: Smoke
# The title carries the commit under test: for a workflow_dispatch run,
# `headSha` in `gh run list` is the dispatching branch's head, not `inputs.sha`.
run-name: Smoke ${{ inputs.sha || github.event.deployment.sha || github.sha }} (${{ github.event_name }})

# Post-deploy smoke of production (https://smartremit.ai) for one commit.
#
# Triggers:
# - push to main: the primary trigger. The run starts at merge time, and its
#   "Wait until production serves this commit" step covers the Vercel build
#   (and a rolling release, if one is configured; Rolling Releases are OFF as
#   of 2026-10-05). While Rolling Releases were on (Sep 21 - early Oct 2026),
#   Vercel posted no GitHub deployment / deployment_status for production
#   builds, so a deployment_status-only smoke never ran for 2365627; the push
#   trigger does not depend on those records. No paths filter: vercel.json's git.deploymentEnabled turns
#   off Git deployments for every branch except main (owner cost rules
#   2026-09-29) and its ignoreCommand still skips component/*; main stays
#   enabled, so every push to main deploys.
# - workflow_dispatch: re-run for a commit on main,
#   `gh workflow run smoke.yml -f sha=<sha>` (7-40 hex chars; empty = the head
#   of the dispatching branch).
# - deployment_status: kept as a fallback for a Production deployment that no
#   push produced. Production success only. When a push-triggered run exists
#   for the same commit, it runs no test and reports that run's verdict (see
#   "Defer to the push-triggered run for this commit").

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to smoke-test (7-40 hex chars). Empty = the head of the branch you dispatch from.
        required: false
        type: string
        default: ''
  deployment_status:

permissions:
  contents: read # checkout, commits and compare API
  actions: read # list this workflow's runs (deployment_status de-duplication)

jobs:
  target:
    name: Resolve the target commit
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Resolve and validate the commit under test
        id: resolve
        # Target = inputs.sha || github.event.deployment.sha || github.sha.
        # Event fields reach the script through env only, never as inline
        # expressions in `run:`. The API call turns a short SHA into the full
        # one, so a push run and a dispatch run of the same commit share the
        # concurrency group below.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          requested="${INPUT_SHA:-${DEPLOYMENT_SHA:-$EVENT_SHA}}"
          if [[ ! "$requested" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error title=Smoke target::The commit to test must be 7-40 hex characters of a commit on main."
            exit 1
          fi

          full="$(gh api "repos/${GH_REPO}/commits/${requested}" --jq '.sha')" || full=""
          if [[ ! "$full" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Smoke target::No commit ${requested} in ${GH_REPO}."
            exit 1
          fi

          # Production only ever serves main, so a dispatched SHA must be on it.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            relation="$(gh api "repos/${GH_REPO}/compare/main...${full}" --jq '.status')" || relation="error"
            if [[ "$relation" != "identical" && "$relation" != "behind" ]]; then
              echo "::error title=Smoke target::Commit ${full:0:7} is not on main (compare status: ${relation}). Production only serves commits on main."
              exit 1
            fi
          fi

          echo "sha=${full}" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
          echo "Smoke target: ${full} (event: ${EVENT_NAME})."

  smoke:
    needs: target
    runs-on: ubuntu-latest
    outputs:
      # Release safety part B: the `rollback` job runs only when the money
      # test or the health check failed on the LIVE build (never for a page test).
      money_failed: ${{ steps.health.outcome == 'failure' || steps.synthetic.outcome == 'failure' }}
    # Up to 25 min waiting for the production build (below), up to 5
    # min for the migration check, up to 2 min for the health check, up to 8
    # min for the synthetic transfer, plus the few minutes the install and
    # Playwright run need.
    timeout-minutes: 50
    # One smoke per commit at a time. A second run for the same commit (a
    # deployment_status event, or a dispatch while the push run is going)
    # waits instead of racing it. GitHub keeps at most ONE waiting job per
    # group: if a third arrives, the waiting one is cancelled and replaced.
    # The group key is the full SHA from `target`, so a short dispatched SHA
    # still lands in the same group as the push run.
    concurrency:
      group: smoke-${{ needs.target.outputs.sha }}
      cancel-in-progress: false

    steps:
      - name: Defer to the push-triggered run for this commit
        id: dedupe
        # deployment_status only. A push to main already started a smoke run
        # for this commit at merge time, and the concurrency group above holds
        # this job until that run's job ends. This run then tests nothing and
        # reports that run's verdict, so the newest run for a SHA never shows a
        # green it did not earn. No push run (a redeploy or promotion that no
        # push produced): test here as usual.
        if: github.event_name == 'deployment_status'
        timeout-minutes: 12
        shell: bash
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WAIT_SECONDS: '600'
        run: |
          set -u
          push_run="$(gh api "repos/${GH_REPO}/actions/workflows/smoke.yml/runs?event=push&head_sha=${TARGET_SHA}&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "$push_run" ]]; then
            echo "No push-triggered smoke run for ${TARGET_SHA:0:7}; this run tests the deployment."
            echo "covered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$push_run" =~ ^[0-9]+$ ]]; then
            echo "::error title=Smoke de-duplication::Unexpected run id from the Actions API."
            exit 1
          fi
          # From here on this run tests nothing: every later step is skipped.
          echo "covered=true" >> "$GITHUB_OUTPUT"

          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while true; do
            info="$(gh api "repos/${GH_REPO}/actions/runs/${push_run}" \
              --jq '[.status, (.conclusion // "none"), .html_url] | join(" ")')" || info="unknown none -"
            read -r status conclusion url <<< "$info"
            if [[ "$status" == "completed" ]]; then break; fi
            if (( $(date +%s) >= deadline )); then
              echo "::error title=Smoke de-duplication::Push-triggered smoke run ${url} for ${TARGET_SHA:0:7} is still ${status} after $(( WAIT_SECONDS / 60 )) min. Its verdict is the one that counts; watch it instead."
              exit 1
            fi
            echo "Push-triggered run ${url} is ${status}; checking again in 15s."
            sleep 15
          done

          if [[ "$conclusion" == "success" ]]; then
            echo "::notice title=Smoke covered by the push run::${url} tested ${TARGET_SHA:0:7} and passed. This deployment_status run tests nothing."
            exit 0
          fi
          echo "::error title=Smoke covered by the push run::${url} tested ${TARGET_SHA:0:7} and concluded ${conclusion}. This deployment_status run does not re-test. Once production serves this commit (or after a fix), re-run with: gh workflow run smoke.yml -f sha=${TARGET_SHA}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.dedupe.outputs.covered != 'true'
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.dedupe.outputs.covered != 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
        if: steps.dedupe.outputs.covered != 'true'

      - name: Setup Playwright (cached)
        if: steps.dedupe.outputs.covered != 'true'
        uses: ./.github/actions/setup-playwright

      - name: Wait until production serves this commit
        if: steps.dedupe.outputs.covered != 'true'
        # A push-triggered run starts at merge time, so this wait covers the
        # Vercel production build (~3-6 min). Testing before production serves
        # the commit would exercise the OLD deployment, and "smoke green on
        # SHA X" would not prove X works. Rolling Releases are OFF (Vercel
        # project config null, checked 2026-10-05); if they are turned back on
        # (10% for 5 min, then 100%), this same wait also covers the rollout,
        # which is what the forced-stable polling below is for.
        #
        # Poll GET /api/version (src/app/api/version/route.ts) until it reports
        # the target's short SHA on REQUIRED_STREAK consecutive polls.
        # Vercel buckets clients STICKILY (hashed from client info such as the
        # IP: https://vercel.com/docs/rolling-releases#understanding-rolling-releases),
        # so plain polls from one runner could sit in the 10% canary bucket and
        # pass early. `vcrrForceStable=true` pins a request to the BASE release
        # while the rollout is below 100% (same page,
        # #setting-the-rolling-release-cookie), so the target SHA appears only
        # once the rollout is complete. Each poll uses a fresh cookie jar and
        # follows redirects, so it works whether Vercel answers the param
        # directly or through a cookie-setting redirect. No Vercel token.
        #
        # Any other SHA, a 404 (an older deployment without the route), any
        # non-200 or a network error resets the streak. Event fields reach the
        # script through env only, never as inline expressions in `run:`.
        timeout-minutes: 27
        shell: bash
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          VERSION_URL: https://smartremit.ai/api/version
          REQUIRED_STREAK: '12'
          POLL_INTERVAL_SECONDS: '5'
          MAX_WAIT_SECONDS: '1500'
        run: |
          set -u
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error title=Rollout wait::The resolved target is not a hex commit SHA; cannot tell which build to wait for."
            exit 1
          fi
          target="$(printf '%s' "${TARGET_SHA:0:7}" | tr 'A-F' 'a-f')"

          body_file="$(mktemp)"
          jar="$(mktemp)"
          trap 'rm -f "$body_file" "$jar"' EXIT

          streak=0
          polls=0
          last="none"
          start="$(date +%s)"
          deadline=$(( start + MAX_WAIT_SECONDS ))
          echo "Waiting for ${VERSION_URL} (forced-stable) to report ${target} on ${REQUIRED_STREAK} consecutive polls, every ${POLL_INTERVAL_SECONDS}s, for up to $(( MAX_WAIT_SECONDS / 60 )) min (Vercel build + rolling release)."

          while true; do
            polls=$(( polls + 1 ))
            : > "$body_file"
            : > "$jar"
            code="$(curl -sS -L --max-redirs 3 --max-time 10 \
                -b "$jar" -c "$jar" \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                -o "$body_file" -w '%{http_code}' \
                "${VERSION_URL}?vcrrForceStable=true&cb=$(date +%s)-${polls}-${RANDOM}")" || code="error"

            seen="-"
            if [[ "$code" == "200" ]]; then
              raw="$(jq -r '.sha // empty' "$body_file" 2>/dev/null || true)"
              if [[ "$raw" =~ ^([0-9a-f]{7}|unknown)$ ]]; then seen="$raw"; else seen="unrecognized"; fi
            fi

            if [[ "$code" == "200" && "$seen" == "$target" ]]; then
              streak=$(( streak + 1 ))
            else
              streak=0
            fi
            last="HTTP ${code}, sha=${seen}"
            elapsed=$(( $(date +%s) - start ))
            echo "poll ${polls} (+${elapsed}s): ${last} -> streak ${streak}/${REQUIRED_STREAK}"

            if (( streak >= REQUIRED_STREAK )); then
              echo "Production serves ${target} (${REQUIRED_STREAK} consecutive polls, ${elapsed}s after the wait began)."
              exit 0
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error title=Production did not serve this commit::Production did not serve ${target} on ${REQUIRED_STREAK} consecutive polls within $(( MAX_WAIT_SECONDS / 60 )) min (last poll: ${last}). Smoke did NOT test this deployment. Likely: the Vercel production build failed or is still queued; or a newer production deployment replaced it; or, if Rolling Releases are on, an earlier rollout is still active (Vercel starts no new rollout until it resolves) or this one is paused, aborted or rolled back. Check Vercel > Deployments, then re-run once production serves this commit: gh workflow run smoke.yml -f sha=${target}"
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: Production has applied every migration this build expects
        if: steps.dedupe.outputs.covered != 'true'
        # BLOCKING: this step fails the smoke (and so skips Playwright) when
        # production has not applied every migration the served build
        # expects, because drizzle selects explicit column lists and an
        # unapplied migration breaks every query on the altered table
        # (2026-06-11 outage). It reads GET /api/version/migrations
        # (src/app/api/version/migrations/route.ts, Bearer CRON_SECRET), which
        # compares the journal bundled into the SERVED build with
        # drizzle.__drizzle_migrations on prod Neon. Migrations are applied by
        # hand (/migrate-prod), so it polls for up to GRACE_SECONDS while the
        # answer is pending, from another build or unreadable, then fails with
        # the pending tags. A missing or rejected CRON_SECRET also fails: an
        # unchecked deploy must not pass as a checked one. Applied rows the
        # journal does not know (divergence, or a rollback to an older build)
        # only warn, so a rollback redeploy is not red. The secret goes only
        # in the header; curl never runs verbose.
        timeout-minutes: 7
        shell: bash
        env:
          TARGET_SHORT: ${{ needs.target.outputs.short }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MIGRATIONS_URL: https://smartremit.ai/api/version/migrations
          GRACE_SECONDS: '300'
          POLL_INTERVAL_SECONDS: '20'
        run: |
          set -u
          target="$(printf '%s' "$TARGET_SHORT" | tr 'A-F' 'a-f')"
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error title=Migration check could not run::The CRON_SECRET repository secret is not available to this run, so production's migrations were NOT checked."
            exit 1
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          start="$(date +%s)"
          deadline=$(( start + GRACE_SECONDS ))
          polls=0
          last="none"
          diverged_warned=0

          while true; do
            polls=$(( polls + 1 ))
            : > "$body_file"
            code="$(curl -sS --max-time 15 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H 'Cache-Control: no-cache' \
                -o "$body_file" -w '%{http_code}' \
                "${MIGRATIONS_URL}?vcrrForceStable=true&cb=$(date +%s)-${polls}-${RANDOM}")" || code="error"

            if [[ "$code" == "401" ]]; then
              echo "::error title=Migration check unauthorized::${MIGRATIONS_URL} answered 401: the CRON_SECRET repository secret does not match production's. Migration status was NOT checked."
              exit 1
            fi

            seen="-"; ok="-"
            if [[ "$code" == "200" ]]; then
              seen="$(jq -r '.sha // empty' "$body_file" 2>/dev/null || true)"
              ok="$(jq -r '.ok' "$body_file" 2>/dev/null || true)"
            fi
            elapsed=$(( $(date +%s) - start ))
            last="HTTP ${code}, sha=${seen}, ok=${ok}"
            echo "poll ${polls} (+${elapsed}s): ${last}"

            if [[ "$code" == "200" && "$seen" == "$target" ]]; then
              expected="$(jq -r '.expected' "$body_file")"
              applied="$(jq -r '.applied' "$body_file")"
              unknown="$(jq -r '.unknownApplied | length' "$body_file")"
              if [[ "$unknown" != "0" && "$diverged_warned" == "0" ]]; then
                diverged_warned=1
                echo "::warning title=Prod migrations diverged::Production has ${unknown} applied migration row(s) that build ${target}'s journal does not list (created_at: $(jq -r '.unknownApplied | map(tostring) | join(", ")' "$body_file")). Investigate before applying anything."
              fi
              if [[ "$ok" == "true" ]]; then
                echo "Production has applied all ${expected} migrations build ${target} expects (${applied} applied)."
                exit 0
              fi
            fi

            if (( $(date +%s) >= deadline )); then
              if [[ "$code" == "200" && "$seen" == "$target" ]]; then
                count="$(jq -r '.pending | length' "$body_file")"
                tags="$(jq -r '.pending | join(", ")' "$body_file")"
                echo "::error title=Prod migrations behind::Production has ${count} migration(s) pending that build ${target} expects: ${tags}. Apply via /migrate-prod, then re-run: gh workflow run smoke.yml -f sha=${target}"
              else
                echo "::error title=Migration check inconclusive::Could not read migration status for build ${target} within $(( GRACE_SECONDS / 60 )) min (last poll: ${last}). Check GET /api/version/migrations by hand, then re-run: gh workflow run smoke.yml -f sha=${target}"
              fi
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: Production health (database and Redis)
        id: health
        if: steps.dedupe.outputs.covered != 'true'
        # Release safety part B. Bearer GET /api/health adds a Neon `select 1`
        # to the Redis read (src/app/api/health/route.ts). The new build must
        # reach both. `worker: stale` only warns: the worker marker is up to 40
        # min old by design and does not depend on this build. A failure here
        # starts the `rollback` job. Three tries, 20 s apart.
        timeout-minutes: 2
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_URL: https://smartremit.ai/api/health
        run: |
          set -u
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error title=Health check could not run::The CRON_SECRET secret is not available to this run."
            exit 1
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          last="none"
          for attempt in 1 2 3; do
            : > "$body_file"
            code="$(curl -sS --max-time 15 -H "Authorization: Bearer ${CRON_SECRET}" -H 'Cache-Control: no-cache' \
              -o "$body_file" -w '%{http_code}' "${HEALTH_URL}?cb=$(date +%s)-${attempt}")" || code="error"
            db="$(jq -r '.db // "-"' "$body_file" 2>/dev/null || echo '-')"
            redis="$(jq -r '.redis // "-"' "$body_file" 2>/dev/null || echo '-')"
            worker="$(jq -r '.worker // "-"' "$body_file" 2>/dev/null || echo '-')"
            errors="$(jq -r '.buildErrors // "-"' "$body_file" 2>/dev/null || echo '-')"
            last="HTTP ${code}, db=${db}, redis=${redis}, worker=${worker}, buildErrors=${errors}"
            echo "attempt ${attempt}: ${last}"
            if [[ "$code" == "401" ]]; then
              echo "::error title=Health check unauthorized::The CRON_SECRET secret does not match production's."
              exit 1
            fi
            if [[ ( "$code" == "200" || "$code" == "503" ) && "$db" == "ok" && "$redis" == "ok" ]]; then
              if [[ "$worker" != "ok" ]]; then
                echo "::warning title=Worker marker not fresh::/api/health reports worker=${worker}. This does not depend on the new build; check the cron."
              fi
              exit 0
            fi
            [[ "$attempt" == "3" ]] || sleep 20
          done
          echo "::error title=Production unhealthy::The new build cannot reach its database or Redis (${last})."
          exit 1

      - name: Synthetic sandbox transfer on the live build
        id: synthetic
        if: steps.dedupe.outputs.covered != 'true'
        # Release safety part B. The same test as release-check.yml, now on
        # the live build, and it also waits for `delivered`: that proves the
        # live worker settles the sandbox transfer on the mock rail. A failure
        # here starts the `rollback` job.
        timeout-minutes: 9
        env:
          CI: 'true'
          SYNTHETIC_TRANSFER: '1'
          SYNTHETIC_WAIT_DELIVERED: '1'
          BASE_URL: https://smartremit.ai
          E2E_SANDBOX_API_KEY: ${{ secrets.E2E_SANDBOX_API_KEY }}
        run: npx playwright test tests/e2e/synthetic-transfer.spec.ts

      - name: Smoke test
        if: steps.dedupe.outputs.covered != 'true'
        # Target the canonical production domain, not target_url. The
        # per-deployment URL (claude-payments-<hash>-<team>.vercel.app) is
        # behind Vercel deployment protection by default, so Playwright would
        # land on an SSO page instead of /login. smartremit.ai is the
        # unprotected public URL we actually want to verify.
        env:
          CI: 'true'
          BASE_URL: https://smartremit.ai
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # The partner fixture is SELF-PROVISIONED by the spec via the admin
          # UI (post fresh-start); only its login password stays a secret.
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        run: npm run e2e

      - name: Upload trace on failure
        if: failure() && steps.dedupe.outputs.covered != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-trace
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 7

  rollback:
    # Release safety part B, layer 2: put the previous production deployment
    # back when the money test or the health check failed on the live build.
    # Push runs only (the merge that deployed this build); a page-test failure
    # never starts it. scripts/ci/release-guard.mjs refuses when a newer merge
    # is already production, opens a GitHub issue and raises one ops alert.
    # After a rollback Vercel promotes no new deploy until a person promotes
    # one (the issue gives the step). Migrations are additive and work with the
    # previous build (CLAUDE.md), so no database step is needed.
    needs: [target, smoke]
    if: always() && github.event_name == 'push' && needs.smoke.outputs.money_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Roll back production, open the issue and raise one ops alert
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          VERCEL_ROLLBACK_TOKEN: ${{ secrets.VERCEL_ROLLBACK_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALERT_URL: https://smartremit.ai/api/ops/deploy-alert
        run: node scripts/ci/release-guard.mjs rollback
