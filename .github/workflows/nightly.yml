# Nightly health run: catches drift that per-PR CI cannot — newly published
# advisories, prod regressions between merges, and flake accumulation (the
# full vitest run still gets the CI-only retry from vitest.config.ts, but a
# persistent nightly failure means a real problem, not a parallel flake).
# 04:43 UTC — odd minute on purpose; GitHub delays/drops on-the-hour crons.
name: Nightly

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Full test suite
        run: npx vitest run

      # Program-Fix 49B (prompt-11): the real-model bot eval. The script itself
      # no-ops (exit 0) when the secret is absent, so this step is a no-op until
      # the owner adds EVAL_OLLAMA_API_KEY. A model failure is reported here but
      # never fails the nightly (continue-on-error) and never gates a merge.
      - name: Bot eval (real model, optional)
        continue-on-error: true
        # Bounded well inside the job's 20 min: 15 calls x 25 s worst case.
        timeout-minutes: 8
        env:
          EVAL_OLLAMA_API_KEY: ${{ secrets.EVAL_OLLAMA_API_KEY }}
        run: npx tsx scripts/eval-bot.ts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Full tree (dev deps included), unlike ci.yml's prod-only audit.
      # Blocking at high: verified 2026-06-12 the current tree exits 0 here.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  # Compliance A3: gitleaks over the FULL history of the default branch (the
  # per-PR job in ci.yml scans only new commits). Same pinned build and the
  # same script as ci.yml; baseline in .gitleaksignore. A found secret fails
  # this run. Redacted output only (public logs).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      # gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (sha256-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/bin/gitleaks
          SCAN_MODE: full
        run: bash scripts/ci/gitleaks-scan.sh

  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Setup Playwright (cached)
        uses: ./.github/actions/setup-playwright

      - name: Live prod smoke
        env:
          CI: 'true'
          BASE_URL: https://smartremit.ai
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        run: npx playwright test tests/e2e/dashboard-smoke.spec.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-trace
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 7
